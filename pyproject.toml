[build-system]
requires = ["setuptools>=69", "wheel", "numpy>=1.26"]
build-backend = "setuptools.build_meta"

[project]
name = "biopic-lm"
version = "0.1.0b1"
description = "BioPic LM desktop workflow for publication-quality light-microscopy figures."
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.12",
  "pillow>=10.2",
  "tifffile>=2024.2",
  "imageio>=2.34",
  "opencv-python-headless>=4.9",
  "scikit-image>=0.23",
  "PySide6>=6.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
  "mypy>=1.10",
]
imaging = [
  "rawpy>=0.21",
]
raw = [
  "rawpy>=0.21",
]
packaging = [
  "pyinstaller>=6.8",
]

[project.scripts]
biopic-lm = "biopic.app.main:main"
biopic = "biopic.app.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
  "-p",
  "no:cacheprovider",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.12"
packages = ["biopic"]
strict = true
warn_unused_ignores = true
disable_error_code = ["type-arg", "no-any-return", "no-untyped-call"]

[[tool.mypy.overrides]]
module = ["scipy.*", "skimage.*", "tifffile.*"]
ignore_missing_imports = true
